# Source health probe — which market-data sources are reachable from GitHub's
# runners with honestly identified requests. Manual or diagnostics branches.
name: Source probe

on:
  workflow_dispatch:
  push:
    branches: ['diag/**']
    paths: ['tools/probe-sources.mjs', '.github/workflows/probe-sources.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/probe-sources.mjs
