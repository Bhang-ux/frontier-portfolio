<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Frontier — Portfolio Intelligence</title>
    <meta name="description" content="Build, analyse and optimise an investment portfolio with quant-grade tools — explained in plain English. Live market data, risk analytics, efficient frontiers, Monte Carlo planning." />
    <meta name="theme-color" content="#070a12" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta property="og:title" content="Frontier — Portfolio Intelligence" />
    <meta property="og:description" content="Quant-grade portfolio analytics and optimisation that explains itself in plain English." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint (no flash).
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('frontier-settings') || '{}');
          var t = (s.state && s.state.theme) || 'dark';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Frontier needs JavaScript to run its analytics in your browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
